<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dhaval Balsara — AI Automation Developer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      scroll-behavior: smooth;
      margin: 0;
      padding: 0;
      background-color: #ffffff;
    }
    h1, h2, h3, h4 {
      font-family: 'Outfit', sans-serif;
    }
    .fade-in {
      animation: fadeIn 0.8s ease-out forwards;
    }
    .slide-up {
      animation: slideUp 0.6s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    #root {
      min-height: 100vh;
    }
    /* Simple loader if JS takes time */
    .initial-load {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Outfit', sans-serif;
      color: #10b981;
      font-weight: 500;
    }
  </style>
</head>
<body class="bg-white text-gray-900 selection:bg-emerald-100 selection:text-emerald-900">
  <div id="root">
    <div class="initial-load">
      Initializing System...
    </div>
  </div>
  <!-- Vite entry point: using relative path for safety -->
  <script type="module" src="./index.tsx"></script>
</body>
</html>
